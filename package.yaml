name:                neoprolog
version:             0.1.0.0
github:              "hyperswine/neoprolog"
license:             GPL-3
author:              "Jasen Qin"
maintainer:          "jasen.qin33@gmail.com"
copyright:           "2025 Jasen Qin"

extra-source-files:
- README.md

description: NeoProlog — a Prolog-inspired logic programming language in Haskell

dependencies:
- base >= 4.7 && < 5
- containers
- mtl
- bytestring
- cryptohash-sha1
- megaparsec
- parser-combinators
- prettyprinter
- prettyprinter-ansi-terminal
- haskeline
- directory
- filepath
- text
- hedgehog

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src
  exposed-modules:
    - NeoProlog

executable neoprolog-exe:
  main:                Main.hs
  source-dirs:         app
  ghc-options:
    - -O2
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
  dependencies:
    - neoprolog

test-suite neoprolog-test:
  type:                exitcode-stdio-1.0
  main-is:             Spec.hs
  source-dirs:         test
  ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
  dependencies:
    - neoprolog
    - hedgehog
    - containers
