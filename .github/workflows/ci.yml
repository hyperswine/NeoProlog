name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The image's Command Line Tools 27 SDK has arm64e.x1 .tbd targets
      # rejected by the GHC 9.8 linker. Select the installed Xcode 26 SDK
      # before setup. Reused GHC package metadata is repaired below as well.
      - name: Select macOS SDK for GHC 9.8
        if: runner.os == 'macOS'
        shell: bash
        run: |
          infera_developer_dir=/Applications/Xcode_26.6.app/Contents/Developer
          test -d "$infera_developer_dir"
          echo "DEVELOPER_DIR=$infera_developer_dir" >> "$GITHUB_ENV"
          infera_sdk_root="$(DEVELOPER_DIR="$infera_developer_dir" xcrun --sdk macosx --show-sdk-path)"
          echo "SDKROOT=$infera_sdk_root" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$infera_developer_dir" xcrun --sdk macosx --show-sdk-version
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.8.2'
          cabal-version: '3.12.1.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lsp/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Repair GHC SDK metadata and check macOS linking
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Preinstalled GHC's rts/ghci package records contain absolute CLT
          # library/include paths, which SDKROOT does not override. Retarget
          # only this selected GHC's metadata; leave CLT and Xcode untouched.
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import shutil
          import subprocess

          sdk = Path(os.environ["SDKROOT"])
          if not sdk.is_dir() or not (sdk / "usr/lib/libSystem.tbd").is_file():
              raise SystemExit(f"Selected SDK is unavailable: {sdk}")
          libdir = Path(subprocess.check_output(["ghc", "--print-libdir"], text=True).strip())
          package_db = Path(subprocess.check_output(["ghc", "--print-global-package-db"], text=True).strip())
          files = [libdir / "settings", *sorted(package_db.glob("*.conf"))]
          if len(files) < 2:
              raise SystemExit(f"Missing GHC package metadata: {package_db}")
          clt_sdk = re.compile(r'/Library/Developer/CommandLineTools/SDKs/MacOSX[^/\s"\']*\.sdk')
          backup = Path(os.environ["RUNNER_TEMP"]) / "infera-ghc-sdk-originals"
          backup.mkdir(exist_ok=True)
          for path in files:
              original = path.read_text()
              repaired = clt_sdk.sub(lambda _: str(sdk), original)
              if repaired != original:
                  shutil.copy2(path, backup / path.name)
                  path.write_text(repaired)
                  print(f"Retargeted SDK paths: {path.name}")
          subprocess.run(["ghc-pkg", "--package-db", str(package_db), "recache"], check=True)
          registered = subprocess.check_output(["ghc-pkg", "--global", "dump"], text=True)
          if clt_sdk.search(registered) or any(clt_sdk.search(path.read_text()) for path in files):
              raise SystemExit("GHC still contains stale Command Line Tools SDK paths")
          print(f"GHC SDK metadata uses {sdk}")
          PY
          infera_probe_dir="$RUNNER_TEMP/infera-ghc-sdk-preflight"
          mkdir -p "$infera_probe_dir/static" "$infera_probe_dir/shared"
          cat > "$infera_probe_dir/Main.hs" <<'HS'
          module Main where
          main :: IO ()
          main = putStrLn "infera macOS SDK link OK"
          HS
          cat > "$infera_probe_dir/InferaSdkProbe.hs" <<'HS'
          module InferaSdkProbe where
          value :: Int
          value = 42
          HS
          ghc -v0 -fforce-recomp -threaded -rtsopts \
            -odir "$infera_probe_dir/static" -hidir "$infera_probe_dir/static" \
            "$infera_probe_dir/Main.hs" -o "$infera_probe_dir/static/probe"
          "$infera_probe_dir/static/probe" +RTS -N1 -RTS
          ghc -v0 -fforce-recomp -dynamic -shared -fPIC \
            -odir "$infera_probe_dir/shared" -hidir "$infera_probe_dir/shared" \
            "$infera_probe_dir/InferaSdkProbe.hs" -o "$infera_probe_dir/shared/libinfera-sdk-probe.dylib"
      - run: cabal update
      - run: cabal build all --enable-tests --enable-benchmarks --enable-optimization=2
      - run: cabal test all --enable-benchmarks --enable-optimization=2 --test-show-details=direct
      - run: npm ci
        working-directory: lsp
      - run: INFERA_BIN="$(cabal list-bin exe:infera --enable-optimization=2)" npm test --prefix lsp
      - run: python3 test/cli.py "$(cabal list-bin exe:infera --enable-optimization=2)"
      - run: python3 -m unittest discover -s test -p bench_harness_test.py
      - run: python3 bench/check-tail-memory.py "$(cabal list-bin bench:machine-tail --enable-optimization=2)" --quick --output /tmp/infera-tail-memory.jsonl
      - run: python3 bench/check-tail-memory.py "$(cabal list-bin bench:machine-tail --enable-optimization=2)" --backend bytecode --quick --output /tmp/infera-bytecode-tail-memory.jsonl
      - run: '"$(cabal list-bin bench:machine-minefield --enable-optimization=2)" --engine native --phase ordinary --size 16 --bombs 50 --timeout 120'
      - run: '"$(cabal list-bin bench:machine-minefield --enable-optimization=2)" --engine bytecode --phase ordinary --size 16 --bombs 50 --timeout 120 --measured'
      - run: '"$(cabal list-bin bench:machine-bytecode --enable-optimization=2)"'
      - run: INFERA_BIN="$(cabal list-bin exe:infera --enable-optimization=2)" sh bench/run.sh --engine infera --case fib --runs 1 --warmup 0 --timeout 30 --json
